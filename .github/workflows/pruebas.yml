name: Pruebas

# Pruebas unitarias de la API (tests/), sin base de datos ni correos reales.
# El despliegue lo hacen Render y Vercel solos con cada push a main.
on:
  push:
    branches: [main]
    paths: ["functions/**", "tests/**", ".github/workflows/pruebas.yml"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: functions/api/requirements.txt
      - run: pip install -r functions/api/requirements.txt pytest
      - run: python -m pytest -q tests
