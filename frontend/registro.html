<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crear cuenta — Motor de Horarios</title>
    <link rel="stylesheet" href="css/estilos.css">
    <script src="js/tema.js"></script>
</head>
<body>
    <header class="barra">
        <span class="marca-grupo">
            <a class="marca" href="index.html">Motor de Horarios</a>
            <button type="button" id="alternar-tema" class="boton-tema"
                    aria-label="Cambiar entre tema claro y oscuro" title="Cambiar tema">🌓</button>
        </span>
        <nav class="nav-principal" id="nav"></nav>
    </header>
    <main>
        <section class="tarjeta-formulario">
            <h1>Crear cuenta</h1>
            <p class="aviso error" id="aviso" hidden></p>
            <form id="form-registro">
                <label for="nombre">Nombre</label>
                <input type="text" id="nombre" name="nombre" maxlength="100" autocomplete="name" required autofocus>

                <label for="email">Correo</label>
                <input type="email" id="email" name="email" maxlength="255" autocomplete="email" required>

                <label for="clave">Contraseña (mínimo 10 caracteres)</label>
                <input type="password" id="clave" name="clave" minlength="10" maxlength="128" autocomplete="new-password" required>

                <label for="confirmar">Confirmar contraseña</label>
                <input type="password" id="confirmar" name="confirmar" minlength="10" maxlength="128" autocomplete="new-password" required>

                <button type="submit" class="boton">Crear cuenta</button>
            </form>
            <p>Las cuentas nuevas quedan con rol Usuario. El rol de administrador se asigna aparte.</p>
            <p>¿Ya tienes cuenta? <a href="login.html">Ingresa</a></p>
        </section>
    </main>
    <footer class="pie">
        <p>Motor de Horarios &mdash; proyecto de portafolio de Luis Felipe Arias.</p>
    </footer>
    <script src="js/config.js"></script>
    <script src="js/comun.js"></script>
    <script src="js/registro.js"></script>
</body>
</html>
