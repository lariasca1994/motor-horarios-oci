<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar sesión — Motor de Horarios</title>
    <link rel="stylesheet" href="css/estilos.css">
    <script src="js/tema.js"></script>
</head>
<body>
    <header class="barra">
        <span class="marca-grupo">
            <a class="marca" href="index.html">Motor de Horarios</a>
            <button type="button" id="alternar-tema" class="boton-tema"
                    aria-label="Cambiar entre tema claro y oscuro" title="Cambiar tema">🌓</button>
        </span>
        <nav class="nav-principal" id="nav"></nav>
    </header>
    <main>
        <section class="tarjeta-formulario">
            <h1>Iniciar sesión</h1>
            <p class="aviso error" id="aviso" hidden></p>
            <form id="form-login">
                <label for="email">Correo</label>
                <input type="email" id="email" name="email" autocomplete="username" required autofocus>

                <label for="clave">Contraseña</label>
                <input type="password" id="clave" name="clave" autocomplete="current-password" required>

                <button type="submit" class="boton">Ingresar</button>
            </form>
            <p>¿No tienes cuenta? <a href="registro.html">Regístrate</a></p>
        </section>
    </main>
    <footer class="pie">
        <p>Motor de Horarios &mdash; proyecto de portafolio de Luis Felipe Arias.</p>
    </footer>
    <script src="js/config.js"></script>
    <script src="js/comun.js"></script>
    <script src="js/login.js"></script>
</body>
</html>
